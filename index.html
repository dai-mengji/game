<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盲人视觉辅助测试</title>
    <script src="https://unpkg.com/@tensorflow/tfjs"></script>
    <script src="https://unpkg.com/@tensorflow-models/coco-ssd"></script>
    <style>
        body { text-align: center; background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 10px; }
        video { width: 100%; max-width: 400px; border-radius: 10px; border: 2px solid #333; min-height: 250px; background: #111; }
        #status { margin-top: 10px; font-size: 18px; font-weight: bold; color: #ffeb3b; min-height: 30px; }
        button { padding: 15px 30px; font-size: 18px; background: #4caf50; color: white; border: none; border-radius: 10px; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>视觉辅助眼镜 (流畅版)</h2>
    <video id="webcam" autoplay playsinline muted></video>
    <div id="status">点击下方按钮启动摄像头...</div>
    <button onclick="start()">启动系统</button>

    <script>
        let isSpeaking = false;
        let lastSpokenTime = 0;
        let lastSpokenText = "";

        async function start() {
            const statusDiv = document.getElementById('status');
            const video = document.getElementById('webcam');

            try {
                // 1. 先申请摄像头权限（这是最核心的）
                statusDiv.innerText = "正在请求摄像头权限...";
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;

                // 2. 摄像头打开后，再唤醒语音并加载模型
                statusDiv.innerText = "正在加载 AI 模型（约10秒）...";
                speak("视觉辅助系统已启动"); // 放在这里更安全
                
                const model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
                statusDiv.innerText = "扫描中...";

                // 3. 开启降频检测
                setInterval(() => {
                    detectFrame(video, model);
                }, 600);

            } catch (error) {
                console.error(error);
                // 如果是没有权限，或者是网络问题，给出精准提示
                if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
                    statusDiv.innerText = "❌ 摄像头权限被拒绝！请在浏览器设置中允许访问。";
                } else if (error.name === 'NotFoundError') {
                    statusDiv.innerText = "❌ 未找到摄像头设备。";
                } else {
                    statusDiv.innerText = "❌ 加载失败：" + error.message + "。请检查网络或刷新重试。";
                }
            }
        }

        async function detectFrame(video, model) {
            if (isSpeaking) return;
            try {
                const predictions = await model.detect(video);
                if (predictions.length > 0) {
                    const bestObj = predictions[0];
                    if (bestObj.score < 0.6) return;

                    let chineseName = translate(bestObj.class);
                    let speakText = `前方有${chineseName}`;

                    const now = Date.now();
                    if (speakText === lastSpokenText && now - lastSpokenTime < 3000) return;

                    document.getElementById('status').innerText = speakText;
                    speak(speakText);
                    lastSpokenText = speakText;
                    lastSpokenTime = now;
                }
            } catch (e) {}
        }

        function speak(text) {
            try {
                window.speechSynthesis.cancel();
                isSpeaking = true;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 1.3; 
                utterance.onend = () => { isSpeaking = false; };
                utterance.onerror = () => { isSpeaking = false; };
                window.speechSynthesis.speak(utterance);
            } catch (e) {
                isSpeaking = false;
            }
        }

        function translate(label) {
            const dict = { 'person': '人', 'car': '汽车', 'chair': '椅子', 'cup': '杯子', 'bottle': '瓶子', 'cell phone': '手机', 'laptop': '电脑', 'dog': '狗' };
            return dict[label] || label;
        }
    </script>
</body>
</html>
