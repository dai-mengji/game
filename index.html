<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盲人视觉辅助测试</title>
    <!-- 换成了国内极其稳定的 unpkg 镜像 -->
    <script src="https://unpkg.com/@tensorflow/tfjs"></script>
    <script src="https://unpkg.com/@tensorflow-models/coco-ssd"></script>
    <style>
        body { text-align: center; background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 10px; }
        video { width: 100%; max-width: 400px; border-radius: 10px; border: 2px solid #333; }
        #status { margin-top: 10px; font-size: 18px; font-weight: bold; color: #ffeb3b; min-height: 30px; }
        button { padding: 15px 30px; font-size: 18px; background: #4caf50; color: white; border: none; border-radius: 10px; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>视觉辅助眼镜 (软件测试版)</h2>
    <video id="webcam" autoplay playsinline muted></video>
    <div id="status">点击下方按钮启动摄像头...</div>
    <button onclick="start()">启动系统</button>

    <script>
        let isSpeaking = false;
        let lastObject = "";

        async function start() {
            const statusDiv = document.getElementById('status');
            const video = document.getElementById('webcam');

            try {
                statusDiv.innerText = "正在加载轻量级 AI 模型（约10秒），请稍候...";
                
                // 打开摄像头 (强制后置摄像头)
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;

                // 加载轻量级模型 lite_mobilenet_v2，速度极快
                const model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });

                statusDiv.innerText = "系统已启动，正在扫描周围...";
                
                // 开始实时检测
                detectFrame(video, model);

            } catch (error) {
                console.error(error);
                statusDiv.innerText = "加载失败！请关闭 WiFi，使用手机流量刷新重试。";
            }
        }

        async function detectFrame(video, model) {
            try {
                const predictions = await model.detect(video);
                
                if (predictions.length > 0) {
                    // 按置信度排序，取最确定的前 2 个物体，防止语音太吵
                    const objects = predictions.slice(0, 2);
                    let speakText = "前方发现：";
                    
                    objects.forEach(obj => {
                        // 把英文标签翻译成简单的中文
                        let chineseName = translate(obj.class);
                        // 加上距离估算（粗略估算，物体框越大越近）
                        let size = obj.bbox[2] * obj.bbox[3];
                        let distance = size > 60000 ? "近处" : "远处";
                        speakText += `${distance}有${chineseName}，`;
                    });

                    // 只有当识别到的物体和上次不同，且不在说话时才播报
                    if (speakText !== lastObject && !isSpeaking) {
                        document.getElementById('status').innerText = speakText;
                        speak(speakText);
                        lastObject = speakText;
                    }
                }
            } catch (e) {
                // 忽略单帧检测错误
            }

            // 持续循环
            requestAnimationFrame(() => detectFrame(video, model));
        }

        function speak(text) {
            isSpeaking = true;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = 1.2; 
            utterance.onend = () => { isSpeaking = false; };
            window.speechSynthesis.speak(utterance);
        }

        function translate(label) {
            const dict = { 'person': '人', 'car': '汽车', 'chair': '椅子', 'cup': '杯子', 'bottle': '瓶子', 'cell phone': '手机', 'laptop': '电脑', 'dog': '狗' };
            return dict[label] || label;
        }
    </script>
</body>
</html>
