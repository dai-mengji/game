
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#04060f"/>
<title>NEON STRIKE · 霓虹突击</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet"/>
<style>
:root{--cyan:#00f0ff;--pink:#ff2d78;--gold:#ffd24a;--fg:#eaf6ff}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#04060f;touch-action:none;overscroll-behavior:none;
  font-family:'Orbitron','PingFang SC','Microsoft YaHei',monospace;color:var(--fg)}
canvas#cv{position:fixed;inset:0;display:block}
#vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(2,4,12,.6) 100%)}
.hidden{display:none!important}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
.hudTL{position:absolute;left:16px;top:calc(10px + env(safe-area-inset-top))}
.lbl{font-size:10px;letter-spacing:3px;color:rgba(234,246,255,.55)}
#scoreV{font-size:26px;font-weight:900;color:#fff;letter-spacing:2px;line-height:1.1}
#hiV{font-size:10px;letter-spacing:2px;color:rgba(0,240,255,.75);margin-top:2px}
.hudTR{position:absolute;right:14px;top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px}
#waveV{font-size:12px;letter-spacing:3px;color:var(--gold);margin-right:4px}
.icoBtn{pointer-events:auto;width:38px;height:38px;border:1px solid rgba(0,240,255,.4);background:rgba(4,10,24,.55);
  color:var(--cyan);display:flex;align-items:center;justify-content:center;cursor:pointer;
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
.icoBtn svg{width:17px;height:17px;fill:currentColor}
.icoBtn:active{background:rgba(0,240,255,.18)}
#livesBox{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:6px}
#livesBox svg{width:19px;height:19px}
#combo{position:absolute;right:18px;top:26%;text-align:right;opacity:0;transition:opacity .18s}
#combo.on{opacity:1}
#comboN{display:block;font-size:30px;font-weight:900;color:var(--gold);font-style:italic}
#combo em{font-style:normal;font-size:9px;letter-spacing:4px;color:rgba(255,210,74,.7)}
#combo.pop #comboN{animation:pop .18s}
@keyframes pop{0%{transform:scale(1.35)}100%{transform:scale(1)}}
#bossBar{position:absolute;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top));width:min(72vw,420px)}
#bossBar .bl{font-size:9px;letter-spacing:4px;color:var(--pink);text-align:center;margin-bottom:4px}
.bt{height:8px;border:1px solid rgba(255,45,120,.7);padding:1px;background:rgba(30,4,14,.6)}
#bossFill{display:block;height:100%;width:100%;background:#ff2d78;transition:width .15s}
#novaBtn{pointer-events:auto;position:absolute;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));
  width:64px;height:64px;background:transparent;border:0;cursor:pointer}
#novaBtn svg{width:100%;height:100%;overflow:visible}
#novaBtn .rb{fill:rgba(4,10,24,.5);stroke:rgba(0,240,255,.25);stroke-width:2}
#novaBtn .ring{fill:none;stroke:var(--cyan);stroke-width:3;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center}
#novaBtn .bolt{fill:rgba(0,240,255,.3)}
#novaBtn.ready{animation:pulse 1s infinite}
#novaBtn.ready .bolt{fill:var(--gold)}
#novaBtn.ready .rb{stroke:rgba(255,210,74,.8)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* ---------- 覆盖层 ---------- */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:auto;
  background:rgba(3,5,14,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.panel{text-align:center;padding:24px 26px;max-width:430px;width:90%}
.tag{font-size:10px;letter-spacing:5px;color:rgba(255,80,80,.9);margin-bottom:14px}
h1{font-size:clamp(44px,11vw,64px);font-weight:900;letter-spacing:2px;color:#fff;line-height:.95;
  text-shadow:3px 0 var(--pink),-3px 0 var(--cyan)}
h1 span{display:block;font-size:.6em;letter-spacing:12px;margin-left:12px}
.sub{font-size:13px;letter-spacing:10px;text-indent:10px;color:rgba(234,246,255,.75);margin:14px 0 18px}
.rows{border-top:1px solid rgba(0,240,255,.25);border-bottom:1px solid rgba(0,240,255,.25);padding:8px 2px;margin-bottom:20px}
.row{display:flex;align-items:baseline;gap:12px;font-size:12px;padding:4px 0;text-align:left}
.row i{font-style:normal;color:var(--gold);letter-spacing:2px;flex:0 0 34px;font-size:11px}
.row b{font-weight:500;color:rgba(234,246,255,.85);letter-spacing:1px}
.row.warn b{color:rgba(255,120,120,.9)}
.cta{font-size:15px;letter-spacing:4px;color:#fff;border:1px solid rgba(0,240,255,.7);padding:13px 10px;cursor:pointer;
  background:rgba(0,240,255,.08);animation:blink 1.6s infinite;
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
@keyframes blink{0%,100%{background:rgba(0,240,255,.08)}50%{background:rgba(0,240,255,.22)}}
.hi{margin-top:16px;font-size:11px;letter-spacing:3px;color:rgba(255,210,74,.8)}
#over h2{font-size:clamp(34px,9vw,52px);font-weight:900;letter-spacing:4px;color:var(--pink);text-shadow:2px 0 var(--cyan)}
.stats{display:flex;justify-content:center;gap:24px;margin:18px 0 24px}
.stat b{display:block;font-size:22px;font-weight:900;color:#fff}
.stat em{font-style:normal;font-size:9px;letter-spacing:3px;color:rgba(234,246,255,.6)}
#pauseOv .p1{font-size:24px;letter-spacing:8px;font-weight:700}
#pauseOv .p2{font-size:11px;letter-spacing:3px;color:rgba(234,246,255,.6);margin-top:10px}

/* ---------- Boss 警报 ---------- */
#warning{position:fixed;left:0;right:0;top:34%;pointer-events:none}
.wbox{border-top:2px solid #ff3b3b;border-bottom:2px solid #ff3b3b;background:rgba(60,4,10,.72);padding:14px 0;position:relative;overflow:hidden}
.wbox::before{content:'';position:absolute;inset:0;animation:slide 1s linear infinite;
  background:repeating-linear-gradient(-45deg,rgba(255,59,59,.16) 0 18px,transparent 18px 36px)}
@keyframes slide{to{background-position:51px 0}}
#warning .wt{position:relative;font-size:clamp(26px,7vw,40px);font-weight:900;letter-spacing:8px;color:#ff3b3b;animation:wflk .5s steps(2) infinite}
@keyframes wflk{50%{opacity:.25}}
#warning .ws{position:relative;font-size:11px;letter-spacing:6px;color:rgba(255,120,120,.9);margin-top:6px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="vignette"></div>

<div id="hud" class="hidden">
  <div class="hudTL">
    <div class="lbl">SCORE</div>
    <div id="scoreV">000000</div>
    <div id="hiV">BEST 0</div>
  </div>
  <div class="hudTR">
    <div id="waveV">WAVE 01</div>
    <button class="icoBtn" id="muteBtn" aria-label="声音">
      <svg id="sndOn" vie
