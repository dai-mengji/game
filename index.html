<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盲人视觉辅助测试</title>
    <script src="https://unpkg.com/@tensorflow/tfjs"></script>
    <script src="https://unpkg.com/@tensorflow-models/coco-ssd"></script>
    <style>
        body { text-align: center; background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 10px; }
        video { width: 100%; max-width: 400px; border-radius: 10px; border: 2px solid #333; }
        #status { margin-top: 10px; font-size: 18px; font-weight: bold; color: #ffeb3b; min-height: 30px; }
        button { padding: 15px 30px; font-size: 18px; background: #4caf50; color: white; border: none; border-radius: 10px; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>视觉辅助眼镜 (流畅版)</h2>
    <video id="webcam" autoplay playsinline muted></video>
    <div id="status">点击下方按钮启动摄像头...</div>
    <button onclick="start()">启动系统</button>

    <script>
        let isSpeaking = false;
        let lastSpokenTime = 0;
        let lastSpokenText = "";

        async function start() {
            const statusDiv = document.getElementById('status');
            const video = document.getElementById('webcam');

            // 1. 强制唤醒手机浏览器的语音引擎（关键！）
            speak("视觉辅助系统已启动");

            try {
                statusDiv.innerText = "正在加载轻量级 AI 模型（约10秒）...";
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;

                const model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
                statusDiv.innerText = "扫描中...";

                // 2. 开启降频检测循环（每 600 毫秒检测一次，画面绝对不卡）
                setInterval(() => {
                    detectFrame(video, model);
                }, 600);

            } catch (error) {
                console.error(error);
                statusDiv.innerText = "加载失败！请关闭 WiFi 使用流量刷新。";
            }
        }

        async function detectFrame(video, model) {
            // 如果正在播报语音，就暂停检测，节省算力
            if (isSpeaking) return;

            try {
                const predictions = await model.detect(video);
                
                if (predictions.length > 0) {
                    // 只取置信度最高的一个物体，避免信息过载
                    const bestObj = predictions[0];
                    
                    // 过滤掉没用的微小物体
                    if (bestObj.score < 0.6) return;

                    let chineseName = translate(bestObj.class);
                    let speakText = `前方有${chineseName}`;

                    // 3. 防抖机制：如果和上次说的一样，并且距离上次说话不到 3 秒，就不说
                    const now = Date.now();
                    if (speakText === lastSpokenText && now - lastSpokenTime < 3000) {
                        return;
                    }

                    document.getElementById('status').innerText = speakText;
                    speak(speakText);
                    lastSpokenText = speakText;
                    lastSpokenTime = now;
                }
            } catch (e) {}
        }

        // 4. 安全的语音播报函数
        function speak(text) {
            // 如果有正在播报的，立刻打断
            window.speechSynthesis.cancel();

            isSpeaking = true;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = 1.3; // 调快语速，像机器报点一样
            utterance.onend = () => { isSpeaking = false; };
            utterance.onerror = () => { isSpeaking = false; }; // 防止报错卡死
            window.speechSynthesis.speak(utterance);
        }

        function translate(label) {
            const dict = { 'person': '人', 'car': '汽车', 'chair': '椅子', 'cup': '杯子', 'bottle': '瓶子', 'cell phone': '手机', 'laptop': '电脑', 'dog': '狗' };
            return dict[label] || label;
        }
    </script>
</body>
</html>
